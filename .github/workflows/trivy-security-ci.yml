name: Trivy Security CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-scan:
    name: Build & Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Build del proyecto con Maven (skip tests para el scan)
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. Instalar Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      # 5. RUN TRIVY — exit-code 0: reporte informativo (VERDE aunque haya vulnerabilidades)
      - name: Run Trivy - Full Report (exit-code 0)
        run: |
          trivy fs . \
            --exit-code 0 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt
          echo "======= TRIVY FULL REPORT ======="
          cat trivy-report.txt

      # 6. Subir el reporte como artefacto
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

      # 7. RUN TRIVY — exit-code 1: falla el pipeline si hay vulnerabilidades HIGH o CRITICAL (ROJO)
      - name: Run Trivy - Fail on HIGH/CRITICAL (exit-code 1)
        run: |
          trivy fs . \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table
