server:
  port: ${PORT:8085}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update        # crea/actualiza columnas automáticamente al iniciar
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── OpenAPI / Swagger ──────────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: AVSA Backend API
    description: >
      API REST para el sistema AVSA Cañete.
      Maestro implementado: Catálogo de Agroquímicos con CRUD completo y auditoría de fecha-hora.
    version: 1.0.0
